# Comment "@claude ..." on any issue or PR to steer Claude by hand,
# e.g. "@claude please address the review" on a PR.
name: "@claude"

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    if: contains(github.event.comment.body, '@claude') && github.event.comment.user.type != 'Bot'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      pr_number: ${{ github.event.issue.pull_request && github.event.issue.number || github.event.pull_request.number || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 30
            --allowedTools "Bash(npm test),Bash(npm run lint),Bash(npm run build)"

  # Pushes made with the workflow token don't trigger other workflows,
  # so re-run CI and review here after Claude updates a PR.
  ci:
    needs: claude
    if: needs.claude.outputs.pr_number != ''
    uses: ./.github/workflows/ci.yml
    with:
      ref: refs/pull/${{ needs.claude.outputs.pr_number }}/head

  review:
    needs: [claude, ci]
    if: needs.claude.outputs.pr_number != ''
    uses: ./.github/workflows/claude-review.yml
    permissions:
      contents: read
      pull-requests: write
      issues: write
    with:
      pr_number: ${{ fromJSON(needs.claude.outputs.pr_number) }}
    secrets: inherit
