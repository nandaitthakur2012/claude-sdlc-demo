name: CI

on:
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Git ref to test (defaults to the triggering ref)
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  checks:
    name: Lint · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: Lint (type check)
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
